name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create-release.outputs.release_id }}
      app_version: ${{ steps.parse-version.outputs.version }}
      is_prerelease: ${{ steps.parse-version.outputs.is_prerelease }}

    steps:
      - uses: actions/checkout@v4
        with:
          # Fetch full history + tag objects so the annotated tag's message
          # is available to use as the release title/description.
          fetch-depth: 0

      - name: Parse version from tag
        id: parse-version
        run: |
          # Strip leading 'v' from tag name (e.g. v1.0.0-alpha.1 → 1.0.0-alpha.1)
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

          # Check if prerelease (contains a hyphen)
          if [[ "${VERSION}" =~ - ]]; then
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
          fi

      - name: Create draft release from tag message
        id: create-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"

          # Make sure the annotated tag object itself is present locally.
          git fetch --tags --force

          # Assemble the gh args in an array to avoid quoting issues with
          # multi-line release notes.
          ARGS=("$TAG" --draft)

          # An annotated tag has objecttype 'tag' and carries a message; a
          # lightweight tag has objecttype 'commit' and no message of its own.
          TAG_TYPE=$(git for-each-ref "refs/tags/${TAG}" --format='%(objecttype)')
          if [ "$TAG_TYPE" = "tag" ]; then
            # First line of the tag message is the title, the rest is the body.
            git for-each-ref "refs/tags/${TAG}" --format='%(contents:subject)' > title.txt
            git for-each-ref "refs/tags/${TAG}" --format='%(contents:body)' > notes.txt
            ARGS+=(--title "$(cat title.txt)" --notes-file notes.txt)
          else
            # Lightweight tag: no message to use, fall back to auto-generated
            # notes so the release body is never empty.
            echo "::warning::Tag ${TAG} is lightweight (no message); falling back to auto-generated notes. Use 'git tag -a' to set a custom title/description."
            ARGS+=(--title "$TAG" --generate-notes)
          fi

          # Mark alpha/beta/rc tags as prerelease.
          if [ "${{ steps.parse-version.outputs.is_prerelease }}" = "true" ]; then
            ARGS+=(--prerelease)
          fi

          # Create the release; if a draft already exists from a re-run, replace it.
          gh release create "${ARGS[@]}" || { gh release delete "$TAG" --yes; gh release create "${ARGS[@]}"; }

          # Fetch and output the release ID for the build jobs to attach assets to.
          RELEASE_ID=$(gh release view "$TAG" --json databaseId --jq .databaseId)
          echo "release_id=${RELEASE_ID}" >> $GITHUB_OUTPUT

  build:
    needs: prepare
    strategy:
      # Don't cancel the other OS builds if one fails — we want every
      # platform's result (and its installers) independently.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Inject version into package.json
        run: npm version ${{ needs.prepare.outputs.app_version }} --no-git-tag-version --allow-same-version

      - name: Inject version into Cargo.toml
        run: |
          if [ "${{ matrix.os }}" = "macos-latest" ]; then
            # macOS uses BSD sed, requires -i ''
            sed -i '' 's/version = "0.1.0"/version = "${{ needs.prepare.outputs.app_version }}"/' src-tauri/Cargo.toml
          else
            # Linux and Windows use GNU sed
            sed -i 's/version = "0.1.0"/version = "${{ needs.prepare.outputs.app_version }}"/' src-tauri/Cargo.toml
          fi

      - name: Inject version into tauri.conf.json
        run: |
          jq --arg v "${{ needs.prepare.outputs.app_version }}" '.version = $v' src-tauri/tauri.conf.json > src-tauri/tauri.conf.json.tmp
          mv src-tauri/tauri.conf.json.tmp src-tauri/tauri.conf.json

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseId: ${{ needs.prepare.outputs.release_id }}
