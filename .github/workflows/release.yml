name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create-release.outputs.release_id }}
      app_version: ${{ steps.parse-version.outputs.version }}
      is_prerelease: ${{ steps.parse-version.outputs.is_prerelease }}

    steps:
      - uses: actions/checkout@v4
        with:
          # Fetch full history + tag objects so the annotated tag's message
          # is available to use as the release title/description.
          fetch-depth: 0

      - name: Parse version from tag
        id: parse-version
        run: |
          # Strip leading 'v' from tag name (e.g. v1.0.0-alpha.1 → 1.0.0-alpha.1)
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

          # Check if prerelease (contains a hyphen)
          if [[ "${VERSION}" =~ - ]]; then
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
          fi

      - name: Create draft release from tag message
        id: create-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"
          REPO="${{ github.repository }}"

          # Make sure the annotated tag object itself is present locally.
          git fetch --tags --force

          # Remove ANY pre-existing releases for this tag (including leftover
          # drafts from prior runs). Draft releases aren't linked to the git
          # tag, so we match on tag_name via the API (paginated) rather than
          # `gh release`.
          for id in $(gh api --paginate "repos/${REPO}/releases" --jq ".[] | select(.tag_name==\"$TAG\") | .id"); do
            echo "Deleting existing release $id for tag $TAG"
            gh api -X DELETE "repos/${REPO}/releases/${id}"
          done

          # Prerelease flag from the tag's semver suffix (e.g. -alpha.1).
          PRERELEASE=false
          if [ "${{ steps.parse-version.outputs.is_prerelease }}" = "true" ]; then
            PRERELEASE=true
          fi

          # Title/notes come from the annotated tag message: first line = title,
          # the rest = body. A lightweight tag has no message, so fall back to
          # GitHub's auto-generated notes.
          TAG_TYPE=$(git for-each-ref "refs/tags/${TAG}" --format='%(objecttype)')
          if [ "$TAG_TYPE" = "tag" ]; then
            TITLE=$(git for-each-ref "refs/tags/${TAG}" --format='%(contents:subject)')
            BODY=$(git for-each-ref "refs/tags/${TAG}" --format='%(contents:body)')
            RELEASE_ID=$(gh api "repos/${REPO}/releases" -X POST \
              -f tag_name="$TAG" \
              -f name="$TITLE" \
              -f body="$BODY" \
              -F draft=true \
              -F prerelease="$PRERELEASE" \
              --jq '.id')
          else
            echo "::warning::Tag ${TAG} is lightweight (no message); using auto-generated notes. Use 'git tag -a' to set a custom title/description."
            RELEASE_ID=$(gh api "repos/${REPO}/releases" -X POST \
              -f tag_name="$TAG" \
              -f name="$TAG" \
              -F draft=true \
              -F prerelease="$PRERELEASE" \
              -F generate_release_notes=true \
              --jq '.id')
          fi

          # The ID comes straight from the create response — no lookup, so it is
          # never empty and the build jobs always attach to THIS release.
          echo "Created release_id=${RELEASE_ID}"
          echo "release_id=${RELEASE_ID}" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    strategy:
      # Don't cancel the other OS builds if one fails — we want every
      # platform's result (and its installers) independently.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo rm -f /etc/apt/sources.list.d/*.list
          sudo apt-get update 2>&1 | grep -i error || true
          sudo apt-get install -y libwebkit2gtk-4.1-dev libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Inject version into package.json
        run: npm version ${{ needs.prepare.outputs.app_version }} --no-git-tag-version --allow-same-version

      - name: Inject version into Cargo.toml
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "macos-latest" ]; then
            # macOS uses BSD sed, requires -i ''
            sed -i '' 's/version = "0.1.0"/version = "${{ needs.prepare.outputs.app_version }}"/' src-tauri/Cargo.toml
          else
            # Linux and Windows use GNU sed
            sed -i 's/version = "0.1.0"/version = "${{ needs.prepare.outputs.app_version }}"/' src-tauri/Cargo.toml
          fi

      - name: Inject version into tauri.conf.json
        shell: bash
        run: |
          jq --arg v "${{ needs.prepare.outputs.app_version }}" '.version = $v' src-tauri/tauri.conf.json > src-tauri/tauri.conf.json.tmp
          mv src-tauri/tauri.conf.json.tmp src-tauri/tauri.conf.json

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseId: ${{ needs.prepare.outputs.release_id }}
